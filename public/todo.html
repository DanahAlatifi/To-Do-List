<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(
          180deg,
          #fdf3e7 0%,
          #e6b89c 50%,
          #b08968 100%
        );
        background-attachment: fixed;
        color: #3e2723;
        font-family: "Inter", sans-serif;
      }
      .card {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(20px);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      }
      .btn {
        background: rgba(255, 255, 255, 0.4);
        color: #3e2723;
        padding: 10px 20px;
        border-radius: 8px;
        transition: all 0.3s ease-in-out;
      }
      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        background: rgba(255, 255, 255, 0.6);
      }
      h1,
      h2 {
        color: #b08968;
      }
    </style>
  </head>
  <body class="flex flex-col items-center min-h-screen p-6">
    <h1 class="text-5xl font-bold mb-8">To-Do List</h1>

    <div class="card w-full max-w-2xl flex items-center shadow-lg">
      <input
        id="taskInput"
        type="text"
        placeholder="Add a task"
        class="p-4 text-black bg-[#FDF3E7] rounded-l-xl w-full border-none focus:ring-2 focus:ring-[#B08968] text-lg"
      />
      <button
        onclick="addTask()"
        class="btn px-5 py-4 rounded-r-xl text-lg font-semibold shadow-md"
      >
        Add
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl mt-8">
      <div class="card min-h-[320px]">
        <h2 class="text-2xl font-semibold mb-4">Completed Tasks</h2>
        <ul id="completedTasks"></ul>
      </div>
      <div class="card min-h-[320px]">
        <h2 class="text-2xl font-semibold mb-4">Pending Tasks</h2>
        <ul id="pendingTasks"></ul>
      </div>
    </div>

    <script>
      let tasks = [];

      function addTask() {
        let taskInput = document.getElementById("taskInput");
        let taskText = taskInput.value.trim();
        if (taskText === "") return;
        let task = {
          id: Date.now(),
          text: taskText,
          completed: false,
          editing: false,
        };
        tasks.push(task);
        taskInput.value = "";
        renderTasks();
      }

      function renderTasks() {
        let completedList = document.getElementById("completedTasks");
        let pendingList = document.getElementById("pendingTasks");
        completedList.innerHTML = "";
        pendingList.innerHTML = "";

        tasks.forEach((task) => {
          let li = document.createElement("li");
          li.className =
            "flex flex-col bg-[#FAE3D9] text-black p-4 my-3 rounded-lg shadow-md";

          if (task.editing) {
            li.innerHTML = `
              <input type="text" id="edit-input-${task.id}" value="${task.text}" class="p-2 text-black rounded w-full mb-2">
              <div class="flex justify-center space-x-4">
                <button onclick="saveTask(${task.id})" class="btn px-4 py-2 rounded-lg font-semibold shadow-md">Save</button>
                <button onclick="deleteTask(${task.id})" class="btn px-4 py-2 rounded-lg font-semibold shadow-md">Delete</button>
              </div>
            `;
          } else {
            li.innerHTML = `
              <div class="flex justify-between items-center">
                <div class="flex items-center">
                  <input type="checkbox" class="mr-3 transform scale-125" ${
                    task.completed ? "checked" : ""
                  } onclick="toggleTask(${task.id})">
                  <span id="task-text-${task.id}" class="text-lg ${
              task.completed ? "line-through text-gray-500" : "text-black"
            }">${task.text}</span>
                </div>
                <button onclick="editTask(${
                  task.id
                })" class="btn px-4 py-2 rounded-lg font-semibold shadow-md">Edit</button>
              </div>
            `;
          }

          if (task.completed) {
            completedList.appendChild(li);
          } else {
            pendingList.appendChild(li);
          }
        });
      }

      function toggleTask(id) {
        let task = tasks.find((t) => t.id === id);
        task.completed = !task.completed;
        renderTasks();
      }

      function deleteTask(id) {
        tasks = tasks.filter((t) => t.id !== id);
        renderTasks();
      }

      function editTask(id) {
        let task = tasks.find((t) => t.id === id);
        task.editing = true;
        renderTasks();
      }

      function saveTask(id) {
        let task = tasks.find((t) => t.id === id);
        let inputField = document.getElementById(`edit-input-${id}`);
        task.text = inputField.value;
        task.editing = false;
        renderTasks();
      }
    </script>
  </body>
</html>
